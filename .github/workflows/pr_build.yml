name: Website CI Build PR

on: [pull_request]

jobs:
  # Never allow "type": "module" in any package.json. This repo is consumed as
  # model/lib source by other CommonJS Node.js build scripts; flipping the
  # module type breaks them all. Use .mjs for individual ESM files instead.
  pre-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 'Reject "type": "module" in any package.json'
        run: |
          bad=0
          while IFS= read -r f; do
            t=$(jq -r '.type // empty' "$f")
            if [ "$t" = "module" ]; then
              echo "::error file=$f::\"type\": \"module\" is forbidden. This repo is imported by CommonJS Node build scripts; setting it breaks them. Use .mjs for individual ESM files instead."
              bad=1
            fi
          done < <(git ls-files -- 'package.json' '**/package.json')
          exit $bad

  build:
    needs: pre-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run cypress tests
        env:
          REACT_DATACORE_URL: https://datacore.app/
          REACT_ASSETS_URL: https://assets.datacore.app/
        uses: cypress-io/github-action@v7
        with:
          install-command: yarn install
          wait-on: 'http://127.0.0.1:8881/'
          wait-on-timeout: 240
          start: npm run develop

      # after the test run completes
      # store videos and any screenshots
      # NOTE: screenshots will be generated only if E2E test failed
      # thus we store screenshots only on failures
      # Alternative: create and commit an empty cypress/screenshots folder
      # to always have something to upload
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
      # Test run video was always captured, so this action uses "always()" condition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
